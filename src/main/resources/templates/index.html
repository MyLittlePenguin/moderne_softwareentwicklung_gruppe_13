<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title}">Votee</title>
	<link rel="stylesheet" href="/css/style.css">
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@4/dist/htmx.min.js" defer></script>
</head>
<body th:attr="'hx-headers:inherited'=${csrfHeadersJson}">
	<header class="kopfzeile">
		<div class="kopfzeile-inhalt">
			<div class="marke">
				<a class="marke-link" href="/"><h1>Votee</h1></a>
				<span class="marke-untertitel">Abstimmungsportal</span>
			</div>
			<nav class="hauptnavigation" aria-label="Hauptnavigation">
				<div class="nav-gruppe" th:if="${session == null}">
					<a class="schaltflaeche schaltflaeche-primar" href="/login">Anmelden</a>
				</div>
				<div class="nav-gruppe" th:if="${session != null}">
					<span class="nutzer-hinweis">Angemeldet als <strong th:text="${session.benutzername}">Nutzer</strong></span>
					<a class="schaltflaeche schaltflaeche-primar" th:if="${session.istAdministrator()}" href="/abstimmungen/neu">Neue Abstimmung erstellen</a>
					<form class="inline-formular" action="/logout" method="post" hx-post="/logout">
						<input type="hidden" name="_csrf" th:value="${csrfToken}">
						<button class="schaltflaeche schaltflaeche-sekundaer" type="submit" hx-disable>Abmelden</button>
					</form>
				</div>
			</nav>
		</div>
	</header>

	<main class="seite">
		<div class="seitenkopf">
			<h2>Umfragen</h2>
			<p class="seiten-beschreibung">Übersicht aller aktuellen und geplanten Abstimmungen.</p>
		</div>

		<div class="leerzustand" th:if="${abstimmungen == null or #lists.isEmpty(abstimmungen)}">
			<p>Noch keine Umfragen vorhanden.</p>
		</div>

		<ul class="abstimmungen-liste" th:if="${abstimmungen != null and !#lists.isEmpty(abstimmungen)}">
			<li class="karte abstimmung-karte" th:each="abstimmung : ${abstimmungen}">
				<h3 class="abstimmung-titel" th:text="${abstimmung.titel}">Titel</h3>
				<p class="abstimmung-beschreibung" th:if="${!#strings.isEmpty(abstimmung.beschreibung)}" th:text="${abstimmung.beschreibung}">Beschreibung</p>
				<p class="abstimmung-zeitraum">
					<span class="meta-label">Zeitraum:</span>
					<span th:text="${abstimmung.beginn}">Beginn</span>
					bis
					<span th:text="${abstimmung.ende}">Ende</span>
				</p>
				<fieldset class="optionen-bereich">
					<legend class="meta-label">Antwortoptionen</legend>
					<ul class="optionen-liste">
						<li class="option-eintrag" th:each="option : ${abstimmung.optionen}">
							<label class="option-auswahl option-auswahl-inaktiv">
								<input type="radio" th:name="'option-' + ${abstimmung.id}" th:value="${option}" disabled>
								<span th:text="${option}">Option</span>
							</label>
						</li>
					</ul>
				</fieldset>
			</li>
		</ul>
	</main>

	<footer class="fusszeile">
		<div class="fusszeile-inhalt">Votee – Digitales Abstimmungssystem</div>
	</footer>
</body>
</html>
