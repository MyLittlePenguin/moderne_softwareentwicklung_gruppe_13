<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title}">Anmeldung – Votee</title>
	<link rel="stylesheet" href="/css/style.css">
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@4/dist/htmx.min.js" defer></script>
</head>
<body>
	<header class="kopfzeile">
		<div class="kopfzeile-inhalt">
			<div class="marke">
				<a class="marke-link" href="/"><span class="marke-name">Votee</span></a>
				<span class="marke-untertitel">Abstimmungsportal</span>
			</div>
			<nav class="hauptnavigation" aria-label="Hauptnavigation">
				<a class="schaltflaeche schaltflaeche-sekundaer" href="/">Zur Übersicht</a>
			</nav>
		</div>
	</header>

	<main class="seite seite-schmal">
		<section class="karte formular-karte">
			<h1 class="formular-titel">Anmeldung</h1>
			<p class="formular-einleitung">Melden Sie sich mit Ihren Zugangsdaten und Ihrem 5-stelligen Einmalcode an.</p>
			<div id="login-formular-container" th:fragment="login-formular">
				<p role="alert" class="fehler" th:if="${fehler != null}" th:text="${fehler}">Fehlermeldung</p>
				<form class="formular" action="/login" method="post"
				      hx-post="/login"
				      hx-target="#login-formular-container"
				      hx-swap="outerHTML">
					<div class="formular-feld">
						<label for="benutzername">Benutzername</label>
						<input id="benutzername" name="benutzername" type="text" autocomplete="username" required th:value="${benutzername}">
					</div>
					<div class="formular-feld">
						<label for="passwort">Passwort</label>
						<input id="passwort" name="passwort" type="password" autocomplete="current-password" required>
					</div>
					<div class="formular-feld">
						<label for="einmalCode">2FA-Einmalcode (5 Ziffern)</label>
						<input id="einmalCode" class="eingabe-code" name="einmalCode" type="text"
						       inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5"
						       autocomplete="one-time-code" placeholder="00000" required>
					</div>
					<div class="formular-aktionen">
						<button class="schaltflaeche schaltflaeche-primar schaltflaeche-vollbreite" type="submit" hx-disable>Anmelden</button>
					</div>
				</form>
			</div>
		</section>
		<p class="zurueck-link"><a href="/">Zurück zur Übersicht</a></p>
	</main>

	<footer class="fusszeile">
		<div class="fusszeile-inhalt">Votee – Digitales Abstimmungssystem</div>
	</footer>
</body>
</html>
