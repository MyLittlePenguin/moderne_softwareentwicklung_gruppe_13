# Prüft, baut und testet das Helidon-Backend bei jedem Push auf main und bei jedem Pull Request.
# Doku: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [main]
  pull_request:

# Ein neuer Push auf denselben Branch bricht den noch laufenden, veralteten Lauf ab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: "27"
          distribution: "temurin"
          cache: maven

      # Checkstyle, Regeln in checkstyle.xml
      - name: Lint
        run: ./mvnw -B checkstyle:check

      # verify = kompilieren, Tests ausführen und das Jar paketieren
      - name: Build and test with Maven
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload application jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: votee_backend
          path: |
            target/votee_backend.jar
            target/libs/
